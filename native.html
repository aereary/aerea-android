<!doctype html>
<html lang="en" class="startup-pending" data-native="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="transparent" />
    <title>aérea</title>
    <style>
      html,body{background:#fff9ed}
      html.appearance-pending,html.appearance-pending body{background:#fff9ed!important}
      html.appearance-pending #root{visibility:hidden}
      html.startup-pending #root{visibility:hidden}
      #native-launch-cover{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#fff9ed;pointer-events:none;contain:strict}
      .native-launch-mark{position:relative;width:58px;height:58px;transform:rotate(-45deg);filter:drop-shadow(0 4px 10px rgba(68,166,229,.14))}
      .native-launch-mark i{position:absolute;top:3px;width:13px;height:52px;border-radius:2px;background:#58b8f8}
      .native-launch-mark i:first-child{left:13px}
      .native-launch-mark i:last-child{right:13px}
      .native-launch-mark i::after{content:"";position:absolute;left:-7px;top:19px;width:27px;height:13px;border-radius:2px;background:inherit}
    </style>
  </head>
  <body>
    <div id="native-launch-cover" aria-hidden="true">
      <span class="native-launch-mark"><i></i><i></i></span>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const key = "aerea-native-appearance-v1";
        const themes = [
          "storybook", "otter", "dreambear", "strawberry", "duckpond",
          "bunnybakery", "mooncat", "whalesong", "ribbonpromise",
          "gentlekitten", "softguidance", "velvetrest", "lovelyevening",
          "rosegrid", "littlesheets", "noirrest", "ao3night",
          "peachparlor", "mintletter", "blueberrynight", "duckmail",
          "moonquilt", "custom",
        ];
        const pending = () => document.documentElement.classList.add("appearance-pending");
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return pending();
          const appearance = JSON.parse(raw);
          if (
            !appearance ||
            typeof appearance.appTheme !== "string" ||
            !themes.includes(appearance.appTheme) ||
            !["light", "dark"].includes(appearance.colorMode) ||
            typeof appearance.background !== "string" ||
            !appearance.background.trim() ||
            (appearance.appTheme === "custom" &&
              (!appearance.customTheme ||
                ["accent", "background", "highlight", "art"].some(
                  (field) => typeof appearance.customTheme[field] !== "string",
                )))
          ) return pending();
          document.documentElement.style.background = appearance.background;
          document.body.style.background = appearance.background;
          const launchCover = document.getElementById("native-launch-cover");
          if (launchCover) launchCover.style.background = appearance.background;
          if (typeof appearance.themeColor === "string" && appearance.themeColor.trim()) {
            document.querySelector('meta[name="theme-color"]')
              ?.setAttribute("content", appearance.themeColor);
          }
        } catch {
          pending();
        }
      })();
    </script>
    <script>
      (() => {
        try {
          const cached = JSON.parse(
            localStorage.getItem("aerea-native-launch-state-v1") || "null",
          );
          if (cached?.version === 1 && cached.state && typeof cached.state === "object") {
            document.documentElement.classList.remove("startup-pending");
          }
        } catch {
          // The first launch stays covered until SQLite restores the saved day.
        }
      })();
    </script>
    <script type="module" src="/app/native-entry.tsx"></script>
  </body>
</html>
