function careToday(){let total=S.routines.filter(due).length,n=S.routines.filter(r=>due(r)&&completed(r)).length;return `<div class="card"><div class="row"><span class="small">Your care, today</span><span class="small" style="color:var(--accent)">${n} of ${total} done</span></div><div class="progress" style="margin-top:17px"><i style="width:${total?n/total*100:0}%"></i></div></div><div class="stack" style="margin-top:17px">${S.routines.map(r=>`<div class="card routine"><button class="check" data-action="routine" data-id="${r.id}" aria-label="Complete ${esc(r.title)}" aria-pressed="${completed(r)}" ${!due(r)?'disabled':''}>${completed(r)?ic('check'):''}</button><div class="body"><span class="symbol">${esc(r.symbol)}</span><strong>${esc(r.title)}</strong><p style="color:${due(r)?'var(--accent)':'var(--faint)'}">${due(r)?completed(r)?'A little care, done':'For today':'A different day'}</p><p>${r.days.length===7?'Every day':r.days.map(d=>DAYS[d]).join(' · ')} · ${esc(r.time)}</p></div>${btn('more','editRoutine','Edit routine','icon small',`data-id="${r.id}"`)}</div>`).join('')}</div><button class="secondary wide" style="margin-top:19px" data-action="newRoutine">${ic('plus')} Add a little routine</button>`}function careRhythm(){let done=0,total=0,history=[85,67,100,50,100,75];for(let d=1;d<=14;d++){let day=date('2026-11-'+String(d).padStart(2,'0')).getDay();S.routines.forEach((r,i)=>{if(r.days.includes(day)){total++;if((d+i)%4!==0)done++}})}S.routines.forEach(r=>{if(due(r)){total++;if(completed(r))done++}});let p=total?Math.round(done/total*100):0;return `<div class="card cluster" style="gap:25px"><div class="ring" style="--p:${p}"><div><b>${p}%</b><small>completed</small></div></div><div><span class="eyebrow">YOUR LITTLE STEPS</span><h3 style="margin-top:9px">A little care adds up.</h3><p class="small">${done} of ${total} scheduled steps<br>this month, including sample history.</p></div></div><section class="section">${section('A week of little steps')}<div class="card" function libraryItems(){return [...S.files.map(f=>({...f,kind:'file'})),...S.notes.map(n=>({...n,type:'NOTE',meta:'A little thought',kind:'note'})),...records.map(r=>({...r,type:'AUDIO',group:'University',meta:r.duration+' · '+(S.classes.find(c=>c.id===r.classId)?.title||'Class audio'),kind:'record'}))].filter(x=>(libraryTab==='All'||(libraryTab==='Notes'?x.type==='NOTE':libraryTab==='Files'?x.type!=='NOTE'&&x.type!=='AUDIO':x.type==='AUDIO'))&&(collection==='All items'||x.group===collection)&&(x.title+' '+(x.text||'')).toLowerCase().includes(libraryQuery.toLowerCase()))}function libraryView(){let items=libraryItems();return head('NOTES · READING · FILES','Your Library','Quick notes, PDFs, EPUB books, and private files—kept together inside Spaces.')+`<div class="miniStats"><b>${S.notes.length}</b> notes<span>·</span><b>${S.files.length}</b> files<span>·</span><b>${records.length}</b> recordings</div><div class="fields"><label class="search">${ic('search')}<input id="librarySearch" aria-label="Search library" placeholder="Find something in your Library" value="${esc(libraryQuery)}"></label>${btn('plus','importMenu','Import a file','plusbtn')}</div><nav class="tabs" style="margin-top:25px">${['All','Notes','Files','Recordings'].map(t=>`<button data-action="libraryTab" data-value="${t}" class="${t===libraryTab?'active':''}">${t}</button>`).join('')}</nav>${!libraryQuery&&libraryTab==='All'?`<button class="hero readingcard wide" data-action="read"><div class="cover">The<br>quiet<br>hours</div><div class="body"><span class="eyebrow">PICK UP WHERE YOU LEFT OFF</span><h3>The quiet hours</h3><div class="small">Chapter 1 · A light left on</div><div class="progress" style="margin-top:15px"><i style="width:28%"></i></div></div></button>`:''}<section class="section">${section('Collections','collection','＋ New')}<div class="pillrow">${['All items',...S.groups].map(g=>`<button data-action="collectionFilter" data-value="${esc(g)}" class="pill ${collection===g?'active':''}">${esc(g const stories=[{id:1,title:'The places we come back to',author:'littlepaperworlds',type:'Series',words:38420,status:'Complete',download:true,ship:'Mara / June',fandom:'Original Work',text:'Five moments of finding a way home. A kitchen light left on, a letter never sent, a familiar voice at the other end of the phone.\n\nSmall beginnings, and the people who make them feel like enough.',tags:['Coming Home','Found Family','Quiet Romance','Second Chances','Letters','Hopeful Ending']},{id:2,title:'Where the afternoon goes',author:'softlywritten',type:'Fic',words:5442,status:'Complete',download:true,ship:'Mara / June',fandom:'Original Work',text:'One free afternoon, a borrowed car, and no particular place to be.\n\nSomewhere between the coast road and the last café still open, the conversation becomes a little easier.',tags:['Slice of Life','Road Trips','Soft Conversations','Seaside','Comfort']},{id:3,title:'Between the last lap and home',author:'afterthechequeredflag',type:'Fic',words:21860,status:'In progress',download:false,ship:'Lando Norris / Oscar Piastri',fandom:'Formula 1 RPF',text:'The season ends. For the first time in months, there is no schedule telling them where to go next.\n\nA fictional story about quiet routines, friendship, and learning how to stand still.',tags:['Off-Season','Friendship','Slow Burn','Travel']}];function filteredStories(){let items=stories.filter(s=>(!shelfDownloaded||s.download)&&(shelfType==='All'||s.type===shelfType)&&(shelfStatus==='All'||s.status===shelfStatus)&&[s.title,s.author,s.ship,...s.tags].join(' ').toLowerCase().includes(shelfQuery.toLowerCase()));if(shelfSort==='short')items.sort((a,b)=>a.words-b.words);if(shelfSort==='long')items.sort((a,b)=>b.words-a.words);if(shelfSort==='title')items.sort((a,b)=>a.title.localeCompare(b.title));return items}function shelfView(){let items=filteredStories();return head('YOUR STORIES, AT YOUR OWN PACE','Fiction shelf','A place for the worlds you return to.','❧')+`<div class="miniStats"><b> d EPUB':'Reading preview'}</button><div class="tiny" style="margin-top:8px">${s.download?'↓ Downloaded · sample':'Sample story'}</div></div><a class="link" target="_blank" rel="noopener noreferrer" href="https://archiveofourown.org/works/search?work_search%5Bquery%5D=${encodeURIComponent(s.title)}">AO3 search ↗</a></div>${s.type==='Series'?`<button class="row wide link" style="padding-top:24px" data-action="series" aria-expanded="${seriesOpen}"><span>${seriesOpen?'The works in this series':'Explore all 5 works'}</span><span>${seriesOpen?'−':'+'}</span></button>${seriesOpen?['A light left on','A place at the table','The long way home','A letter for the morning','What stays'].map((t,i)=>`<button class="work" data-action="read"><span>0${i+1}</span><div><strong>${t}</strong><small class="tiny">Part ${i+1} · Complete</small></div></button>`).join(''):''}`:''}</article>`).join('')||empty('No stories found. Try changing a filter.','book')}
function studyView(){let classes=S.classes.filter(c=>c.days.includes(weekDay));return head('STUDY · YOUR WEEK, TOGETHER','This week’s map','A little structure, and room to breathe.')+`<div class="row" style="margin-bottom:22px"><span class="small">${esc(S.semester.name)} · Nov 15–21</span><button class="link" data-action="semester">Edit semester</button></div><nav class="tabs"><button class="active">Schedule</button><button data-nav="degree">My degree ↗</button></nav>${miniWeek('study')}<div class="hero"><div class="row"><span class="eyebrow">${DAYS[weekDay].toUpperCase()} · NOVEMBER ${15+weekDay}</span><span class="badge ${classes.length?'lilac':'sage'}">${classes.length?'Class day':'A little pause'}</span></div><h2>${classes.length?'A little room to learn.':'A day with room for you.'}</h2><p>${classes.length?'Your class notes and audio are always close by.':'No classes in your weekly schedule. Your plans can still live here.'}</p></div><section class="section">${section('Your classes','newClass','＋ Add class')}${classes.length?classes.map(c=>`<div class="timeline"><small>${time(c.start)}</small><button class="event" data-action="classDetail" data-id="${c.id}" style="--event:var(--${c.color})"><strong>${esc(c.title)}</strong><small>${c.code} · Until ${time(c.end)}</small></button></div>`).join(''):empty('No classes on '+DAYS[weekDay]+'. Choose another day, or add a class.','cap')}</section><button class="link" data-action="dayException" style="margin-top:20px">A day outside your usual routine? Mark this day ↗</button><section class="section">${section('One place for your studies')}<div class="stack"><button class="itemrow" data-nav="degree">${soft('cap','honey')}<div><strong>My degree</strong><small>Each course, a little closer.</small></div>${ic('chev')}</button><button class="itemrow" data-nav="recordings">${soft('mic','lilac')}<div><strong>Recordings & notes</strong><small>Listen back, right where you need it.</small></div>${ic('chev')}</button></div></section>` le="margin:12px 0 5px 57px">Open Day pocket ↗</button><section class="section"><div class="hero"><span class="eyebrow">A LITTLE CHECK-IN</span><h2>How did this day feel?</h2><p>Just a little sign of your day.</p>${moodsHTML(selected)}</div></section><section class="section">${section('Little things that happened')}<div class="tags">${['Studied','Self-care','Moved','Rested','Social','Ate out','Period'].map(t=>`<button class="pill ${(S.tags[selected]||[]).includes(t)?'active':''}" data-action="dayTag" data-value="${t}">${t}</button>`).join('')}</div></section><button class="itemrow" data-action="dayDone" style="margin-top:23px"><span class="check" aria-pressed="${!!S.dayDone[selected]}">${S.dayDone[selected]?ic('check'):''}</span><div><strong>A day, gently wrapped up.</strong><small>Mark it complete when you’re ready.</small></div></button>`}const moods=[['Happy','⌒ᴗ⌒','#e4b4c8'],['Peaceful','˘ᴗ˘','#b8cfb8'],['Okay','•ᴗ•','#e0cc91'],['Tired','−.−','#b1c4db'],['Sad','•︵•','#b4cdd0']];function moodsHTML(k){return `<div class="moodrow">${moods.map(([m,f,c])=>`<button class="mood" data-action="mood" data-date="${k}" data-value="${m}" aria-pressed="${S.moods[k]===m}"><span class="face" style="--c:${c}">${f}</span>${m}</button>`).join('')}</div>`}
