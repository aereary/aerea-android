name: Sync sports fixtures

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Supabase Edge Function to refresh fixtures
        env:
          SPORTS_SYNC_SECRET: ${{ secrets.SPORTS_SYNC_SECRET }}
        run: |
          test -n "${SPORTS_SYNC_SECRET}"
          curl --fail --silent --show-error \
            --request POST \
            --header "x-sports-sync-secret: ${SPORTS_SYNC_SECRET}" \
            "https://wislppgaikbxgibrjizz.supabase.co/functions/v1/sync-sports-events"
